name: Record Package Metadata

on:
    push:
        branches: [master]
        paths:
            - "packages/**"
    workflow_dispatch:

permissions:
    contents: write
    # gh workflow run dispatches the index generation workflow.
    actions: write

jobs:
    record:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              working-directory: generator
              run: bun install

            - name: Record owners, first published and last updated
              working-directory: generator
              env:
                  REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ secrets.REGISTRY_BOT_TOKEN }}
                  # Optional: override the commit author (defaults to the account
                  # behind REGISTRY_BOT_TOKEN, then "robolde").
                  BOT_NAME: ${{ secrets.REGISTRY_BOT_NAME }}
                  BOT_EMAIL: ${{ secrets.REGISTRY_BOT_EMAIL }}
              run: bun ./src/record-metadata.ts

            # The index generator reads last-updated.json, so it must run after
            # this workflow has committed it (a push-triggered index workflow
            # could race it). Regenerate only on package pushes.
            - name: Regenerate index
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run index.yml
