name: Record Package Metadata

on:
    push:
        branches: [master]
        # Only package changes trigger this workflow. Its own commit touches
        # authority.json / last-updated.json, so it cannot trigger itself.
        paths:
            - "packages/**"
    workflow_dispatch:

permissions:
    contents: write
    # gh workflow run dispatches the index generation workflow.
    actions: write

jobs:
    record:
        runs-on: ubuntu-24.04
        steps:
            - name: Create GitHub App token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.REGISTRY_APP_ID }}
                  private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}

            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  token: ${{ steps.app.outputs.token }}

            - uses: lde-org/setup-lde@v2

            - name: Record owners, first published and last updated
              env:
                  REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  # Optional: override the commit author. An App installation
                  # token cannot resolve /user, so set these to attribute the
                  # bot's commits to a real account.
                  BOT_NAME: ${{ secrets.REGISTRY_BOT_NAME }}
                  BOT_EMAIL: ${{ secrets.REGISTRY_BOT_EMAIL }}
              run: lde run src/record-metadata.lua

            # The index generator reads last-updated.json, so it must run after
            # this workflow has committed it (a push-triggered index workflow
            # could race it). Regenerate only on package pushes.
            - name: Regenerate index
              if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run index.yml
