name: Namespace Requests

on:
    issues:
        types: [opened]
    issue_comment:
        types: [created]

permissions:
    contents: write
    issues: write

concurrency:
    group: namespace-request-${{ github.event.issue.number }}
    cancel-in-progress: false

jobs:
    request:
        if: >-
            (github.event_name == 'issues' && contains(github.event.issue.body, '/request-namespace')) ||
            (github.event_name == 'issue_comment' &&
             (contains(github.event.comment.body, '!approve') || contains(github.event.comment.body, '@robolde')))
        runs-on: ubuntu-latest
        steps:
            - name: Create GitHub App token
              id: app
              uses: actions/create-github-app-token@v2
              with:
                  app-id: ${{ vars.REGISTRY_APP_ID }}
                  private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}

            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ steps.app.outputs.token }}

            - uses: lde-org/setup-lde@v1

            - name: Handle namespace request
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  EVENT: ${{ github.event_name }}
                  REPO: ${{ github.repository }}
                  ISSUE_NUMBER: ${{ github.event.issue.number }}
                  ISSUE_BODY: ${{ github.event.issue.body }}
                  ISSUE_AUTHOR_ID: ${{ github.event.issue.user.id }}
                  ISSUE_AUTHOR_LOGIN: ${{ github.event.issue.user.login }}
                  COMMENT_BODY: ${{ github.event.comment.body }}
                  COMMENT_AUTHOR_LOGIN: ${{ github.event.comment.user.login }}
                  COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
                  BOT_NAME: ${{ secrets.REGISTRY_BOT_NAME }}
                  BOT_EMAIL: ${{ secrets.REGISTRY_BOT_EMAIL }}
              run: lde run src/namespace-request.lua
