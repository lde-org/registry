name: Check PR

# Requires an Actions event policy that explicitly allows pull_request_target
# after GitHub enforces the default block on 2026-12-02.
on:
    pull_request_target:
        types: [opened, synchronize, reopened]
        paths:
            - "packages/**"
            - "authority.json"
            - "last-updated.json"

permissions:
    contents: read

concurrency:
    group: check-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - name: Create GitHub App token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.REGISTRY_APP_ID }}
                  private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}

            # pull_request_target runs in the base repo context (so secrets are
            # available even for fork PRs). We check out the BASE revision and
            # only read PR contents via `git show` — never execute PR code.
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  fetch-depth: 0
                  token: ${{ steps.app.outputs.token }}

            - uses: lde-org/setup-lde@v1

            - name: Fetch PR head
              env:
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: git fetch origin "refs/pull/${PR_NUMBER}/head"

            - name: Run check
              id: check
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
                  PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
                  PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
                  REPO: ${{ github.repository }}
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  COMMENT_FILE: ${{ runner.temp }}/comment.md
              run: lde run src/check-pr.lua

            - name: Close rejected PR
              if: steps.check.outputs.verdict == 'close'
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
                  gh pr close "$PR_NUMBER"

            - name: Request changes
              if: steps.check.outputs.verdict == 'request-changes'
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
                  # GitHub forbids reviewing your own PR; the comment above always
                  # carries the errors, so a self-review failure is not fatal.
                  gh pr review "$PR_NUMBER" --request-changes --body "Changes requested automatically - see comment above." || true

            - name: Approve new package
              if: steps.check.outputs.verdict == 'approve'
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
                  gh pr review "$PR_NUMBER" --approve --body "Approved automatically - see comment above." || true

            - name: Approve and merge update
              if: steps.check.outputs.verdict == 'approve-merge'
              env:
                  GH_TOKEN: ${{ steps.app.outputs.token }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
                  gh pr review "$PR_NUMBER" --approve --body "Approved automatically - see comment above." || true
                  gh pr merge "$PR_NUMBER" --auto --merge
