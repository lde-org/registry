name: Generate Index

# Dispatched by the "Record Package Metadata" workflow after it has committed
# last-updated.json, so the index never races the metadata update. Can also be
# run manually.
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              working-directory: generator
              run: bun install

            - name: Generate index.json
              run: bun run generate
              working-directory: generator

            - name: Deploy to dist branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: dist
                  publish_dir: generator/dist
