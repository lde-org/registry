name: Generate Index

# Dispatched by the "Record Package Metadata" workflow after it has committed
# last-updated.json, so the index never races the metadata update. Can also be
# run manually.
on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    generate:
        runs-on: ubuntu-24.04
        steps:
            - name: Create GitHub App token
              id: app
              uses: actions/create-github-app-token@v3
              with:
                  app-id: ${{ vars.REGISTRY_APP_ID }}
                  private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}

            - uses: actions/checkout@v6
              with:
                  token: ${{ steps.app.outputs.token }}

            - uses: lde-org/setup-lde@v1

            - name: Generate index.json
              run: lde run src/generate-index.lua

            - name: Deploy to dist branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ steps.app.outputs.token }}
                  publish_branch: dist
                  publish_dir: dist
